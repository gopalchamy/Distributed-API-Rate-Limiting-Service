server:
  port: 8080

spring:
  application:
    name: distributed-rate-limiter
  
  # Default datasource: Embedded H2 for zero-configuration startup, configurable to PostgreSQL via SPRING_PROFILES_ACTIVE=postgres or env vars
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ratelimiterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration: Defaults to standard localhost:6379, gracefully falls back to high-performance in-memory bucket if unreachable
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

# Application Specific Properties
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  rate-limiter:
    default-capacity: 60
    default-refill-tokens: 60
    default-refill-period-seconds: 60
    enable-redis-fallback: true
    default-plans:
      free:
        capacity: 20
        refill-tokens: 20
        refill-period-seconds: 60
      pro:
        capacity: 120
        refill-tokens: 120
        refill-period-seconds: 60
      enterprise:
        capacity: 600
        refill-tokens: 600
        refill-period-seconds: 60

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
